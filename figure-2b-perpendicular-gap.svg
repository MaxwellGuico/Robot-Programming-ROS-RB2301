<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Figure 2B — Perpendicular gap width</title>
  <desc id="desc">Top-down diagram showing a diagonal 0.40 metre line between two can edges, resolved into a 0.32 metre component perpendicular to the robot path and a 0.24 metre forward component. The useful 0.32 metre width is smaller than the required 0.33 metres, so the gap is rejected.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green-start" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9 Z" fill="#16835f"/>
    </marker>
    <marker id="arrow-amber-start" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9 Z" fill="#c26b11"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #172033; }
      .small { font-size: 19px; }
      .label { font-size: 22px; font-weight: 650; }
      .measure { font-size: 24px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="64" font-size="34" font-weight="750">Figure 2B. Perpendicular gap width</text>
  <text x="70" y="98" font-size="20" fill="#526071">Only the component of the gap perpendicular to the planned path is usable.</text>

  <!-- Left: top-down geometric construction -->
  <rect x="55" y="130" width="910" height="710" rx="22" fill="#f8fafc" stroke="#d9e1ea" stroke-width="2"/>
  <text x="85" y="805" class="label" fill="#526071">Top view</text>

  <!-- Cans: centres lie along the diagonal through their inner-edge points -->
  <g filter="url(#shadow)">
    <circle cx="228" cy="246" r="90" fill="#aeb8c5" stroke="#697587" stroke-width="4"/>
    <circle cx="756" cy="642" r="90" fill="#aeb8c5" stroke="#697587" stroke-width="4"/>
    <circle cx="228" cy="246" r="65" fill="none" stroke="#cbd3dc" stroke-width="3"/>
    <circle cx="756" cy="642" r="65" fill="none" stroke="#cbd3dc" stroke-width="3"/>
  </g>
  <text x="156" y="251" font-size="20" font-weight="700" fill="#465467">CAN</text>
  <text x="727" y="648" font-size="20" font-weight="700" fill="#465467">CAN</text>

  <!-- Gap endpoints A=(300,230), B=(684,518); right-triangle corner C=(684,230) -->
  <line x1="300" y1="300" x2="684" y2="588" stroke="#193a66" stroke-width="8" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="8" fill="#193a66"/>
  <circle cx="684" cy="588" r="8" fill="#193a66"/>
  <text x="272" y="340" class="small" fill="#475569">inner edge</text>
  <text x="697" y="614" class="small" fill="#475569">inner edge</text>

  <!-- Perpendicular and forward components -->
  <line x1="300" y1="300" x2="684" y2="300" stroke="#16835f" stroke-width="5" stroke-dasharray="11 8"
        marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green-start)"/>
  <line x1="684" y1="300" x2="684" y2="588" stroke="#c26b11" stroke-width="5" stroke-dasharray="11 8"
        marker-start="url(#arrow-amber-start)" marker-end="url(#arrow-amber-start)"/>
  <path d="M654 300 L654 330 L684 330" fill="none" stroke="#667085" stroke-width="3"/>
  <text x="492" y="275" text-anchor="middle" class="measure" fill="#126f51">0.32 m perpendicular width</text>
  <text x="711" y="425" class="label" fill="#a4550b">0.24 m</text>
  <text x="711" y="453" class="small" fill="#a4550b">forward offset</text>

  <!-- Hypotenuse label -->
  <g transform="translate(492 420) rotate(36.87)">
    <rect x="-92" y="-29" width="184" height="40" rx="8" fill="#ffffff" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" class="measure" fill="#193a66">g = 0.40 m</text>
  </g>

  <!-- Robot and planned direction d -->
  <line x1="492" y1="730" x2="492" y2="455" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <circle cx="492" cy="444" r="7" fill="#2563eb"/>
  <text x="514" y="490" class="label" fill="#1d5dcc">d (planned path)</text>
  <g transform="translate(492 750)" filter="url(#shadow)">
    <rect x="-72" y="-55" width="144" height="110" rx="24" fill="#e5edf8" stroke="#325d8c" stroke-width="4"/>
    <path d="M0 -77 L-17 -45 L17 -45 Z" fill="#2563eb"/>
    <circle cx="-52" cy="0" r="11" fill="#32445a"/>
    <circle cx="52" cy="0" r="11" fill="#32445a"/>
    <text x="0" y="14" text-anchor="middle" font-size="20" font-weight="750" fill="#325d8c">ROBOT</text>
  </g>

  <!-- Perpendicular indicator -->
  <line x1="465" y1="535" x2="519" y2="535" stroke="#16835f" stroke-width="4"/>
  <line x1="492" y1="508" x2="492" y2="562" stroke="#2563eb" stroke-width="4"/>
  <path d="M492 535 L509 535 L509 518" fill="none" stroke="#667085" stroke-width="3"/>
  <text x="443" y="591" font-size="18" fill="#526071">perpendicular to d</text>

  <!-- Right: decision panel -->
  <rect x="1000" y="130" width="345" height="710" rx="22" fill="#ffffff" stroke="#d9e1ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="1032" y="178" class="label">Controller check</text>
  <line x1="1032" y1="198" x2="1313" y2="198" stroke="#e2e8f0" stroke-width="2"/>

  <text x="1032" y="247" class="small" fill="#526071">Cross-product width</text>
  <text x="1032" y="286" font-size="27" font-weight="750">|g × d| = 0.32 m</text>
  <text x="1032" y="327" class="small" fill="#526071">The diagonal is not the clearance.</text>

  <!-- Scale comparison -->
  <text x="1032" y="391" class="small" font-weight="700">Useful opening</text>
  <rect x="1032" y="410" width="224" height="42" rx="8" fill="#31a77c"/>
  <text x="1046" y="438" font-size="21" font-weight="750" fill="#ffffff">0.32 m</text>

  <text x="1032" y="497" class="small" font-weight="700">Required clearance</text>
  <rect x="1032" y="516" width="231" height="42" rx="8" fill="#df4b4b"/>
  <text x="1046" y="544" font-size="21" font-weight="750" fill="#ffffff">0.33 m</text>
  <line x1="1263" y1="395" x2="1263" y2="576" stroke="#b42318" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M1256 473 L1263 466 L1270 473" fill="none" stroke="#b42318" stroke-width="3"/>
  <text x="1281" y="474" font-size="17" font-weight="700" fill="#b42318">10 mm</text>
  <text x="1281" y="496" font-size="17" fill="#b42318">short</text>

  <rect x="1032" y="620" width="281" height="120" rx="16" fill="#fff1f1" stroke="#df4b4b" stroke-width="3"/>
  <text x="1172.5" y="663" text-anchor="middle" font-size="27" font-weight="800" fill="#b42318">0.32 m &lt; 0.33 m</text>
  <text x="1172.5" y="710" text-anchor="middle" font-size="31" font-weight="850" fill="#b42318">REJECT GAP</text>
  <text x="1172.5" y="786" text-anchor="middle" font-size="18" fill="#526071">The robot needs 10 mm more space.</text>
</svg>
